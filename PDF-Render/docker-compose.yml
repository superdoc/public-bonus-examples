# Dev environment. Run with:  docker compose watch
#
# One service, one port — the same shape as the Cloud Run deployment. In dev the
# Express process mounts Vite in middleware mode, so HMR and /api share port 8080.
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: development
      PORT: '8080'
    # `watch` syncs files into the container instead of bind-mounting the whole
    # project, so the image's node_modules is not shadowed by the host's.
    develop:
      watch:
        # Client sources — Vite HMR picks these up, no restart needed.
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync
          path: ./public
          target: /app/public
        # Types shared by client and server.
        - action: sync
          path: ./shared
          target: /app/shared
        # Server sources — tsx watch reloads, and compose restarts as a backstop.
        - action: sync+restart
          path: ./server
          target: /app/server
        # Dependency or build-config changes need a fresh image.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./vite.config.ts
